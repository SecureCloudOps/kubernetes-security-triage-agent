apiVersion: apps/v1
kind: Deployment
metadata:
  name: privileged-api
  namespace: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: privileged-api
  template:
    metadata:
      labels:
        app: privileged-api
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      containers:
        - name: api
          image: example.invalid/privileged-api:1.0.0
          securityContext:
            privileged: true
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              add:
                - SYS_ADMIN
                - NET_ADMIN
              drop: []
            seccompProfile:
              type: Unconfined
