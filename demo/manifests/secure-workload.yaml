apiVersion: v1
kind: ServiceAccount
metadata:
  name: secure-workload
  namespace: secure-demo
automountServiceAccountToken: false
---
# An explicit zero-rule Role documents that this workload needs no Kubernetes
# API permissions. The disabled token mount enforces the same runtime boundary.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secure-no-access
  namespace: secure-demo
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secure-no-access
  namespace: secure-demo
subjects:
  - kind: ServiceAccount
    name: secure-workload
    namespace: secure-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secure-no-access
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secure-web-content
  namespace: secure-demo
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head><meta charset="utf-8"><title>KSTA secure demo</title></head>
      <body><h1>Secure demo workload</h1></body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-web
  namespace: secure-demo
  labels:
    app.kubernetes.io/name: secure-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: secure-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secure-web
    spec:
      serviceAccountName: secure-workload
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # BusyBox is a small, fixed-version image with a much smaller package
          # and vulnerability surface than the intentionally old image below.
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command: ["httpd"]
          args: ["-f", "-p", "8080", "-h", "/www"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: content
              mountPath: /www
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: secure-web-content
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: secure-web
  namespace: secure-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: secure-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secure-web-ingress
  namespace: secure-demo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: secure-web
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: secure-demo
          podSelector:
            matchLabels:
              access: secure-web
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secure-web-egress
  namespace: secure-demo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: secure-web
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
