apiVersion: v1
kind: ServiceAccount
metadata:
  name: vulnerable-workload
  namespace: vulnerable-demo
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vulnerable-secret-reader
  namespace: vulnerable-demo
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vulnerable-secret-reader
  namespace: vulnerable-demo
subjects:
  - kind: ServiceAccount
    name: vulnerable-workload
    namespace: vulnerable-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vulnerable-secret-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-web
  namespace: vulnerable-demo
  labels:
    app.kubernetes.io/name: vulnerable-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vulnerable-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vulnerable-web
    spec:
      serviceAccountName: vulnerable-workload
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: nginx
          # This old release is intentionally used to provide known CVE evidence.
          image: nginx:1.16.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            capabilities:
              add: ["ALL"]
---
# No NetworkPolicy selects this workload; that omission is intentional.
apiVersion: v1
kind: Service
metadata:
  name: vulnerable-web
  namespace: vulnerable-demo
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: vulnerable-web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
